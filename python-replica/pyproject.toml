[project]
name = "vibe-excel-python"
version = "0.1.0"
description = "Vibe Excel 的自包含 Python 复刻版"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "pandas>=2.2,<3",
  "openpyxl>=3.1,<4",
  "xlrd>=2.0,<3",
  "PyYAML>=6.0,<7",
  "psutil>=6.0,<8",
]

[project.scripts]
vibectl = "vibe_excel.cli:main"
vibe-book = "vibe_excel.book.cli:main"
vibe-sqlmap = "vibe_excel.sqlmap.cli:main"
vibe-encode = "vibe_excel.encoder.cli:main"

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
  "pytest>=8.0,<10",
  "ruff>=0.11,<1",
  "mypy>=1.15,<2",
  "types-PyYAML",
  "types-psutil",
]

[tool.hatch.build.targets.wheel]
packages = ["src/vibe_excel"]

[tool.hatch.build.targets.wheel.force-include]
"vibe.plugins.yml" = "vibe_excel/vibe.plugins.yml"
"examples" = "vibe_excel/examples"
"prompts" = "vibe_excel/prompts"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["src/vibe_excel/engines", "examples/pipeline.py"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
files = ["src/vibe_excel"]
exclude = ["src/vibe_excel/engines"]
check_untyped_defs = true
disallow_untyped_defs = true
warn_return_any = true
warn_unused_ignores = true
no_implicit_optional = true

[[tool.mypy.overrides]]
module = ["vibe_excel.engines", "vibe_excel.engines.*"]
follow_imports = "skip"

[tool.uv]
default-groups = ["dev"]
