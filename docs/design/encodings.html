<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<title>产物与机器：三种编码对照（未定案）</title>
<style>
  /* 自包含：只带这张对照图需要的记号色，与 DESIGN.md §3 同一套值。 */
  :root{
    --bg:#f3f3f1; --obj:#ffffff; --ink:#1c1c1a; --ink2:#55555a; --muted:#69696e;
    --line:rgba(28,28,30,.14); --line2:rgba(28,28,30,.075);
    --dot:rgba(28,28,30,.12); --edge:rgba(28,28,30,.30);
    --mono:"SF Mono","Cascadia Mono",ui-monospace,Consolas,monospace;
    --font:-apple-system,BlinkMacSystemFont,"Segoe UI Variable Text","Segoe UI","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  }
  *{box-sizing:border-box}
  body{margin:0;background-color:var(--bg);background-image:radial-gradient(var(--dot) 1px,transparent 1px);
       background-size:24px 24px;padding:22px 26px;color:var(--ink);font:13px/18px var(--font)}
  .pair{font-size:11px;line-height:16px;color:var(--muted);letter-spacing:.02em;margin:0 0 6px}
  .pair b{color:var(--ink2);font-weight:600}
  .row{position:relative;height:52px;margin-bottom:22px}
  .wire{position:absolute;top:26px;height:1px;background:var(--edge)}
  .arrow{position:absolute;top:22px;width:0;height:0;border-left:5px solid var(--edge);
         border-top:4px solid transparent;border-bottom:4px solid transparent}

  /* 产物：白卡 */
  .cd{position:absolute;top:0;display:flex;flex-direction:column;justify-content:center;gap:1px;
      width:150px;height:52px;padding:0 11px;border:1px solid var(--line);border-radius:10px;
      background:var(--obj);box-shadow:0 1px 2px rgba(30,30,34,.07),0 2px 7px -3px rgba(30,30,34,.08)}
  .cd .nm{font-weight:500;font-size:12.5px;line-height:18px;color:var(--ink);white-space:nowrap}
  .cd .x{font:500 11px/15px var(--mono);color:var(--ink2);font-variant-numeric:tabular-nums}

  /* E1 透明框 */
  .e1{position:absolute;left:190px;width:150px;top:3px;height:46px;padding:0 11px;border-radius:7px;
      border:1px solid var(--line2);display:flex;flex-direction:column;justify-content:center;gap:0}
  .e1 .fn{font:500 11.5px/16px var(--mono);color:var(--ink)}
  .e1 .dur{font:11px/15px var(--mono);color:var(--ink2)}

  /* E2 墨胶囊 */
  .e2{position:absolute;left:190px;width:150px;top:2px;height:48px;padding:0 14px;border-radius:24px;
      background:var(--ink);color:var(--bg);display:flex;flex-direction:column;justify-content:center;gap:0;
      box-shadow:0 1px 3px rgba(30,30,34,.16)}
  .e2 .fn{font:600 11.5px/16px var(--mono);letter-spacing:-.01em;color:var(--bg)}
  .e2 .dur{font:11px/15px var(--mono);color:var(--bg);opacity:.66}

  /* E3 管段 */
  .e3{position:absolute;left:190px;width:150px;top:3px;height:46px;display:flex;flex-direction:column;
      align-items:center;justify-content:center;gap:0}
  .e3 .fn{font:500 11.5px/16px var(--mono);color:var(--ink);background:var(--bg);padding:0 7px}
  .e3 .dur{font:11px/15px var(--mono);color:var(--ink2);background:var(--bg);padding:0 7px}
  .tick{position:absolute;top:11px;width:1px;height:24px;background:var(--edge)}
</style>
</head>
<body>

<div class="pair"><b>E1 · 透明框</b>　现在这版：只靠 3% 亮度差，缩到 30% 就没了</div>
<div class="row">
  <div class="wire" style="left:150px;width:40px"></div>
  <div class="wire" style="left:340px;width:40px"></div>
  <div class="arrow" style="left:376px"></div>
  <div class="cd" style="left:0"><span class="nm">raw_available</span><span class="x">6,337×6</span></div>
  <div class="e1"><span class="fn">clean_positions</span><span class="dur">1.3 s</span></div>
  <div class="cd" style="left:380px"><span class="nm">site_positions</span><span class="x">6,337×4</span></div>
</div>

<div class="pair"><b>E2 · 墨胶囊</b>　纸与墨：白色是刷出来的东西，黑色是印上去的工序</div>
<div class="row">
  <div class="wire" style="left:150px;width:38px"></div>
  <div class="wire" style="left:342px;width:38px"></div>
  <div class="arrow" style="left:376px"></div>
  <div class="cd" style="left:0"><span class="nm">raw_available</span><span class="x">6,337×6</span></div>
  <div class="e2"><span class="fn">clean_positions</span><span class="dur">1.3 s</span></div>
  <div class="cd" style="left:380px"><span class="nm">site_positions</span><span class="x">6,337×4</span></div>
</div>

<div class="pair"><b>E3 · 管段</b>　机器不是盒子，是线上的一段：名字压在管身上，两侧各一道法兰</div>
<div class="row">
  <div class="wire" style="left:150px;width:230px"></div>
  <div class="arrow" style="left:376px"></div>
  <div class="cd" style="left:0"><span class="nm">raw_available</span><span class="x">6,337×6</span></div>
  <div class="e3"><span class="fn">clean_positions</span><span class="dur">1.3 s</span>
    <span class="tick" style="left:4px"></span><span class="tick" style="right:4px"></span></div>
  <div class="cd" style="left:380px"><span class="nm">site_positions</span><span class="x">6,337×4</span></div>
</div>

</body>
</html>
